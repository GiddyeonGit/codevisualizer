<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Visualizer</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
      :root {
        --color-bg: #f8fafc;
        --color-surface: #ffffff;
        --color-text: #1e293b;
        --color-text-secondary: #64748b;
        --color-border: #e2e8f0;
        --color-accent: #3b82f6;
        --color-accent-hover: #2563eb;
        --color-dropzone-bg: rgba(59, 130, 246, 0.05);
        --color-dropzone-border: #3b82f6;
        --color-overlay-bg: rgba(255, 255, 255, 0.95);
        --color-overlay-border: #e2e8f0;
        --color-scrollbar: #cbd5e1;
        --color-scrollbar-hover: #94a3b8;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
        --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
      }
      [data-theme="dark"] {
        --color-bg: #0f0f13;
        --color-surface: #1a1a23;
        --color-text: #e2e8f0;
        --color-text-secondary: #64748b;
        --color-border: #2a2a3a;
        --color-accent: #60a5fa;
        --color-accent-hover: #93bbfc;
        --color-dropzone-bg: rgba(96, 165, 250, 0.08);
        --color-dropzone-border: #60a5fa;
        --color-overlay-bg: rgba(15, 15, 19, 0.95);
        --color-overlay-border: #2a2a3a;
        --color-scrollbar: #334155;
        --color-scrollbar-hover: #475569;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: system-ui, sans-serif;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-scrollbar);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-scrollbar-hover);
      }
    </style>
    <script>
      (function() {
        var theme = localStorage.getItem('codevisualizer-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
